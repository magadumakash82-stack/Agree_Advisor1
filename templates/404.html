{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}
{% block page_title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 60px 20px;">
  <div style="font-size: 54px; color: var(--primary); margin-bottom: 12px;">
    <i class="fa-solid fa-compass"></i>
  </div>
  <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">Page Not Found</h2>
  <p style="font-size: 13.5px; color: var(--text-muted); margin-bottom: 24px;">
    The requested system view does not exist or has been relocated.
  </p>
  <a href="{{ url_for('web.dashboard') }}" class="btn btn-primary">
    <i class="fa-solid fa-house"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
